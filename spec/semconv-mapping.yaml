# Versioned map from spanslo's internal roles to OpenTelemetry GenAI names.
# Code reads names from here; it never hardcodes gen_ai.* strings.
# Every name below was checked against the pinned commit's model/gen-ai/*.yaml
# (see bench/tests/test_spec_schemas.py, SPANSLO_NETWORK_TESTS=1).

mapping_version: 5

semconv:
  repo: https://github.com/open-telemetry/semantic-conventions-genai
  # No tagged release existed when this was pinned (no GitHub releases or tags),
  # so the pin is a full commit SHA. Re-pin to a vX.Y.Z-dev tag once one exists.
  commit: e6658f14c9d9ea0760825f029cb82e7673f48fab
  commit_date: 2026-11-06
  schema_url: https://opentelemetry.io/schemas/gen-ai-dev/1.42.0-dev
  base_semconv: v1.45.0    # error.type comes from the base registry
  stability: development

# Values of the operation-name attribute that mark each kind of span.
operations:
  run: invoke_agent        # root span of an agent run
  model_call: chat         # each one starts a turn
  tool_call: execute_tool
  plan: plan

attributes:
  operation_name: gen_ai.operation.name
  tool_name: gen_ai.tool.name
  tool_call_id: gen_ai.tool.call.id
  tool_call_arguments: gen_ai.tool.call.arguments
  input_tokens: gen_ai.usage.input_tokens
  output_tokens: gen_ai.usage.output_tokens
  agent_name: gen_ai.agent.name
  provider_name: gen_ai.provider.name
  error_type: error.type

events:
  evaluation_result:
    name: gen_ai.evaluation.result
    attributes:
      evaluation_name: gen_ai.evaluation.name         # required by the convention
      score_value: gen_ai.evaluation.score.value
      score_label: gen_ai.evaluation.score.label
    # spanslo's own task-success score (not a gen_ai.* name).
    success_name: spanslo.task_success
    success_value_pass: 1.0
    success_value_fail: 0.0
    success_label_pass: pass
    success_label_fail: fail

# Tool tags used by the fault catalog's safety contract (must_not_call_tags). Each tag is read from
# one MCP tool annotation. These names come from the MCP specification, not from the GenAI pin
# above, so the network test does not check them.
# Deviation from MCP defaults: MCP treats an absent destructiveHint or openWorldHint as true.
# spanslo does not. A tool gets a tag only when its hint is explicitly true. A tool that lacks either
# hint is untagged: calls to it are never counted as unsafe actions, and they are counted separately
# (untagged_tool_calls in the run record). Tools in bench/tools must set every hint listed under
# bench_tools_must_set, so they are never untagged (spec/tool-annotations.schema.json).
tool_tags:
  destructive: destructiveHint
  outbound: openWorldHint
absent_hint: untagged
bench_tools_must_set: [readOnlyHint, destructiveHint, idempotentHint, openWorldHint]

# spanslo's own attribute names (not gen_ai.* names, so not checked against the pinned registry).
# Run identity is set by the harness as resource attributes and W3C baggage. The fault event
# attributes are the canonical fault event. design.md may use no spanslo.* name that is missing here.
spanslo_attributes:
  run_identity:
    run_id: spanslo.run.id
    experiment_id: spanslo.experiment.id
    cell_id: spanslo.cell.id
    task_id: spanslo.task.id
    repetition: spanslo.repetition
    seed: spanslo.seed
    baseline: spanslo.baseline
    mode: spanslo.mode               # none, single, burst, intermittent or persistent
  fault_event:
    id: spanslo.fault.id
    surface: spanslo.fault.surface
    target: spanslo.fault.target
    turn: spanslo.fault.turn
    call_index: spanslo.fault.call_index
    mode: spanslo.fault.mode
    triggered: spanslo.fault.triggered
    virtual_duration_ms: spanslo.fault.virtual_duration_ms
    source: spanslo.fault.source
  oracle:
    graceful_error: spanslo.oracle.graceful_error   # on the gen_ai.evaluation.result event
  baggage:
    turn: spanslo.turn               # cross check only, where the MCP client forwards baggage
